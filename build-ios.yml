name: Build GazeTouch iPhone app (unsigned IPA)

on:
  workflow_dispatch:
  push:
    paths:
      - "iPhone/**"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project "iPhone/GazeTouchARKit/GazeTouchARKit.xcodeproj" \
            -scheme GazeTouchARKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/GazeTouchARKit.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/GazeTouchARKit.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/GazeTouchARKit-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GazeTouchARKit-unsigned-IPA
          path: GazeTouchARKit-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
